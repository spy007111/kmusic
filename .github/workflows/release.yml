name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # runner 只有 2 核 7G：给 Gradle 上限内联编译，避免 Kotlin daemon 被 OOM 杀掉
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 手动装 Gradle：wrapper 与第三方 action 都踩过下载超时，curl 带重试最稳
      - name: Install Gradle
        run: |
          set -eu
          curl -sSL --retry 6 --retry-delay 5 --retry-all-errors \
            -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.1.0-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-9.1.0/bin/gradle" --version

      # 直接拉 commandline-tools 自己装：比第三方 action 少一层版本漂移
      - name: Set up Android SDK
        run: |
          set -eu
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          # 注意别开 pipefail：`yes` 被 sdkmanager 读完会 SIGPIPE(141)，pipefail 会让整步失败
          ( yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
              "platform-tools" "platforms;android-36" "build-tools;36.0.0" ) > /tmp/sdk.log 2>&1 || {
              tail -40 /tmp/sdk.log; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          # jitpack（jellyfin ffmpeg 解码器）偶发超时/429，构建整个重试 3 次
          for attempt in 1 2 3; do
            echo "=== attempt $attempt ===" >> /tmp/build.log
            if gradle :app:assembleDebug --no-daemon --stacktrace \
                 -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee -a /tmp/build.log; then
              exit 0
            fi
            echo "attempt $attempt failed, retry in 30s"
            sleep 30
          done
          exit 1

      # 失败时把编译日志塞进 run 的 Summary（公开可见，不用登录捞日志）
      - name: Dump build log
        if: failure()
        run: |
          echo '### 构建失败，末尾 80 行' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "log lines: $(wc -l < /tmp/build.log 2>/dev/null || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          # 同时转成 annotation（可匿名通过 API 读取，方便定位）
          grep -E "Could not resolve|Could not GET|Could not download|BUILD FAILED|What went wrong" /tmp/build.log | tail -6 | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error title=build-cause::/'
          tail -12 /tmp/build.log | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error title=build-tail::/'
          
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: KMusic ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
