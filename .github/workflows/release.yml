name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # runner 只有 2 核 7G：给 Gradle 上限内联编译，避免 Kotlin daemon 被 OOM 杀掉
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 用 setup-gradle 装发行包：自带重试 + 缓存（wrapper 直连经常 10s 超时失败）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      # 直接拉 commandline-tools 自己装：比第三方 action 少一层版本漂移
      - name: Set up Android SDK
        run: |
          set -eu
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          # 注意别开 pipefail：`yes` 被 sdkmanager 读完会 SIGPIPE(141)，pipefail 会让整步失败
          ( yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
              "platform-tools" "platforms;android-36" "build-tools;36.0.0" ) > /tmp/sdk.log 2>&1 || {
              tail -40 /tmp/sdk.log; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace \
            -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee /tmp/build.log

      # 失败时把编译日志塞进 run 的 Summary（公开可见，不用登录捞日志）
      - name: Dump build log
        if: failure()
        run: |
          echo '### 构建失败，末尾 80 行' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "log lines: $(wc -l < /tmp/build.log 2>/dev/null || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          # 同时转成 annotation（可匿名通过 API 读取，方便定位）
          tail -12 /tmp/build.log | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error title=build-tail::/'
          
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: KMusic ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
